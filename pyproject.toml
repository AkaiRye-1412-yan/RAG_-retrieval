[project]
name = "akairye-rag"
version = "0.1.0"
description = "AkaiRye 知识RAG平台 - 本地知识库检索桌面应用"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "langchain~=1.3",
    "langchain-openai>=0.6",
    "langchain-text-splitters>=1",
    "langgraph>=1",
    "tavily-python>=0.7",
    "numpy<3",
    "pymupdf>=1.26",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pillow>=10",
    "rapidocr-onnxruntime==1.4.4",
    "pywebview>=5",
]

[project.scripts]
akairye-rag = "akairye_rag.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
