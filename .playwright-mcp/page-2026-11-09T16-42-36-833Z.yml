        - generic [ref=f1e411]: 使用说明
        - list [ref=f1e416]:
          - listitem [ref=f1e417]: 配置密钥：在上方填写火山方舟 ARK_API_KEY 并选择模型，点「测试连接」通过后即可对话；不配置密钥也能管理文档，但 AI 问答不可用。
          - listitem [ref=f1e418]: 上传文档：到「向量库」页上传 PDF、Word、Excel、TXT 或图片，等待 解析→切分→嵌入 全部完成（扫描件与图片自动 OCR）。
          - listitem [ref=f1e419]: 开始提问：系统优先检索本地知识库作答并标注 [1] 来源；知识库未命中时，只有「工具调用模式」为 auto/on 且已配置 Tavily Key，才会联网搜索。
          - listitem [ref=f1e420]: 切换模型只改一行：修改 ARK_MODEL（换成新的豆包模型或 ep- 接入点）即可，其余配置无需变动；换向量模型记得重建索引。
          - listitem [ref=f1e421]: 数据安全：.env 与 akairye.db 都在程序目录，可随时备份；所有网络服务仅监听本机 127.0.0.1。